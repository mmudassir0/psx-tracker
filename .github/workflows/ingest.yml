name: PSX Daily Data Ingest

on:
  schedule:
    # Runs here rather than as a Vercel Cron because PSX refuses Vercel's IPs
    # (HTTP 462). GitHub often starts scheduled jobs late or skips them, so the
    # job runs several times; the script stops early once the session is saved
    # and never saves while the market is open.
    #   11:00, 12:00, 14:00, 16:00 UTC = 4, 5, 7, 9 PM PKT, Monday to Friday
    - cron: "0 11,12,14,16 * * 1-5"
    #   02:00 UTC Tuesday to Saturday = 7 AM PKT, before the open: catches the
    #   previous session if every evening run was skipped.
    - cron: "0 2 * * 2-6"
  workflow_dispatch:

# Never two at once: a late run and the next slot would write the same rows.
concurrency:
  group: psx-ingest
  cancel-in-progress: false

# Issues: the failure report below opens/closes an issue with GITHUB_TOKEN.
permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure database indexes
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -o pipefail
          npx tsx src/scripts/ensure-indexes.ts 2>&1 | tee -a ingest.log

      - name: Run PSX Ingest
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # Alert delivery (browser push, email, Telegram). Any secret not set
          # is empty and that channel is simply skipped.
          SITE_URL: ${{ secrets.SITE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
        # A manual run from the Actions tab always ingests.
        run: |
          set -o pipefail
          npx tsx src/scripts/ingest.ts --trigger=schedule ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} 2>&1 | tee -a ingest.log

      # The in-app crash alert needs the database (it looks up who the admins
      # are), so it can't fire when the database itself is the problem. This
      # one needs nothing but GitHub: the first failure opens an issue with the
      # error (GitHub notifies you), later failures update it quietly, and the
      # next good run closes it.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/ingest-issue.sh fail

      - name: Close failure report
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/ingest-issue.sh ok
